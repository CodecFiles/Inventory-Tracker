# Runs every database and backend test on each push and pull request.
# Builds throwaway PostgreSQL databases from supabase/migrations, runs supabase/tests (pgTAP), the
# concurrency test and the backend tests (Vitest). No secrets needed — it never touches Supabase.
name: Database tests

on:
  push:
  pull_request:

jobs:
  db-tests:
    runs-on: ubuntu-24.04
    env:
      PGHOST: /var/run/postgresql
    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL 16 and pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER"

      - name: Run database tests
        run: scripts/db-test.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Run backend tests
        run: |
          npm ci
          npm test
